<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC's Style Maker</title>
    <link rel="icon" href="/images/sm_icon.png" type="image/png">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div id="header" style="background-color:#BFBFBF;">
        <img src="/images/sm_icon.png" alt="SM Icon" style="display: inline-block; vertical-align: middle; margin-right: 10px;">
        <!-- <s>^^^ AI is so good to use do you know ^^^</s> -->
        <!-- Oh I know it always "br" is because I used <h1> in next line -->
        SC's Style Maker
        <!-- Not longer use <tit> -->
    </div>
    <input type="text" id="preview" value="Yeah this is preview"><button type="button" onclick="preview();">View</button>
    <hr><p id="previewt">Change the preview text than click "View" button to show your style!</p><hr>
    <!-- Basic settings -->
    <h1>Basics</h1>
    <input type="checkbox" id="Bold"><label><b>Bold</b></label><br>
    <input type="checkbox" id="Italics"><label><i>Italics</i></label><br>
    <input type="checkbox" id="Overline"><label><o>Overline</o></label><br>
    <input type="checkbox" id="Underline"><label><u>Underline</u></label><br>
    <input type="checkbox" id="Strikethrough"><label><s>Strikethrough</s></label><br>
    <hr>
    <!-- Color settings -->
    <h1>Color</h1>
    <select id="c-type" onchange="colorType()">
        <option value="none">No color</option>
        <option value="rgbc">RGB</option>
        <option value="hexc">HEX code</option>
        <option value="pick">Color picker</option>
        <option value="html">HTML basic colors</option>
    </select>
    <div id="color-controls-container"></div>
    <hr>
    <!-- Size settings -->
    <h1>Size</h1>
    <input type="checkbox" id="csize"><label>Change size</label><br>
    <input type="number" id="size" value="100">
    <h2>(WIP)</h2>
    <!-- Ahh WIP -->
</body>
</html>
